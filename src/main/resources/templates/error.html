<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Off road douchebag</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/nav.css}" type="text/css"/>
</head>
<body>
<div th:replace="~{fragments/navigation.html :: topNavigation(~{ :: .currentlocation})}">
    <div class="currentlocation">
       Error
    </div>
</div>
<div class="range-box">
    <p><strong>Status:</strong> <span th:text="${status}">500</span></p>
    <p><strong>Error:</strong> <span th:text="${error}">Internal Server Error</span></p>
    <p><strong>Message:</strong> <span th:text="${#messages}">Error Details</span></p>
    <p><strong>Path:</strong> <span th:text="${path}">/broken-link</span></p>
    <p><strong>Timestamp:</strong> <span th:text="${timestamp}">Timestamp</span></p>
</div>

</body>
<footer>
    <div th:replace="~{fragments/navigation.html :: bottomNavigation}">
        </div>
</footer>
</html>
