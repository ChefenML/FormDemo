<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Time to yell on the internet</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="stylesheet" th:href="@{/css/nav.css}" type="text/css"/>
</head>

<body class="page-social">
<div th:replace="~{fragments/navigation.html :: topNavigation(~{ :: .currentlocation})}">
    <div class="currentlocation">
        Social Shit posting
    </div>
</div>

<div class="range-box">

    <form action="/social" th:action="@{/social}" method="post" th:object="${messageModel}">
        <label for="name">User Name</label>
        <input type="text" id="name" th:field="*{name}" placeholder="Name of stupid">
        <span class="alert alert-warning" th:if="${#fields.hasErrors('name')}">Cant be empty, minimum 3 characters, maximum 20 characters</span>

        <label for="textarea">Shit posting goes here:</label>
        <textarea th:field="*{message}" placeholder="Dumb shit goes here" id="textarea" name="textarea" rows="4"
                  cols="50">
    </textarea>
        <span class="alert alert-warning" th:if="${#fields.hasErrors('message')}">Cant be empty, minimum 3 characters, maximum 200 characters</span>
        <label for="dropbox">Who can see your dumb shit:</label>
<!--    <label for="privpub">Private/Public</label>-->
<!--    <input th:field="*{privpub}" type="text" id="privpub" name="privpub">-->
        <select th:field="*{privpub}" id="dropbox">
<!--            <option th:value="'M'" th:text="Male"></option>-->
<!--            <option th:value="'F'" th:text="Female"></option>-->
<!--        <label for="viewoptions">Choose who can see your shitposting:</label>-->
<!--        <select th:field="*{privpub}" id="viewoptions" name="viewoptions">-->
            <option th:value="'private'" th:text="Private"></option>
            <option th:value="'public'" th:text="Public"></option>
            <option th:value="'network'" th:text="Network"></option>
        </select>
        <br>
        <button type="submit">Submit your shit</button>
    </form>
</div>

<!--<p th:text="'year ' + ${today.getYear} + ' month: ' + ${today.getMonth} + ' day: ' + ${today.getDayOfWeek}"></p>-->
<div class="range-box">
<a th:href="@{/viewall/private}"> <button> PrivateDB</button></a>
<a th:href="@{/viewall/network}"> <button> NetWorkDB</button></a>
<a th:href="@{/viewall}"><button> AllPostDB</button></a>
</div>
</body>
<footer>
    <div th:replace="~{fragments/navigation.html :: bottomNavigation}">
    </div>
</footer>
</html>
