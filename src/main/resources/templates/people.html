<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${something}"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/nav.css}" type="text/css"/>
</head>
<body>
<h1 th:text="${something}"></h1>
<table class="nice-table">
    <thead>
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Kørekort</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="person: ${people}">
        <td th:text="${person.name}"></td>
        <td th:text="${person.age}"></td>
        <td th:if="${person.age >= 18}">✅</td>
        <td th:unless="${person.age >= 18}">⛔</td>
    </tr>
    </tbody>
</table>
</body>
<footer>
    <div th:replace="~{fragments/navigation.html :: bottomNavigation}">
    </div>
</footer>
</html>
